line-length = 100
target-version = "py311"
src = ["Src", "Tests"]

extend-exclude = [
    ".venv",
    "Alembic/versions",
    "Recon/Output",
]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RET",
]

# El proyecto usa PascalCase por convencion (ver CLAUDE.md).
# Desactivamos pep8-naming entero.
ignore = [
    "E501",
]

[lint.per-file-ignores]
"Tests/**" = ["B011"]
"Alembic/env.py" = ["E402"]

[lint.isort]
known-first-party = ["CongresoMx"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
