# Override para deploy en server. No expone Mariadb ni Redis al host
# (la comunicacion entre containers va por la red CongresoMxNet).
# Solo AppApi queda accesible en el puerto 8000 del host.
#
# Uso:
#   docker compose -f Docker/DockerCompose.yml \
#                  -f Docker/DockerCompose.Server.yml \
#                  up -d --build

services:
  Mariadb:
    # 127.0.0.1:13306 expone Mariadb solo dentro del VPS (loopback).
    # Para llegar desde el Mac: ssh -L 13306:127.0.0.1:13306 root@VPS.
    # !override reemplaza la lista del compose principal en vez de anadirse.
    ports: !override
      - "127.0.0.1:13306:3306"

  Redis:
    ports: !reset []
