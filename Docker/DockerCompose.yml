services:
  Mariadb:
    image: mariadb:11
    container_name: CongresoMxMariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MariadbRootPassword:-ChangeMeRootPass}
      MARIADB_DATABASE: ${MariadbDatabase:-CongresoMx}
      MARIADB_USER: ${MariadbUser:-CongresoMx}
      MARIADB_PASSWORD: ${MariadbPassword:-CongresoMxPass}
      MARIADB_CHARACTER_SET_SERVER: utf8mb4
      MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - MariadbData:/var/lib/mysql
      - ./MariadbInit:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - CongresoMxNet

  Redis:
    image: redis:7-alpine
    container_name: CongresoMxRedis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - RedisData:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - CongresoMxNet

  AppApi:
    build:
      context: ..
      dockerfile: Docker/AppDockerfile
    image: congresomx-app:latest
    container_name: CongresoMxAppApi
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: UTC
    command: ["uvicorn", "CongresoMx.Api.Main:App", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      Mariadb:
        condition: service_healthy
      Redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - CongresoMxNet

  AppScheduler:
    build:
      context: ..
      dockerfile: Docker/AppDockerfile
    image: congresomx-app:latest
    container_name: CongresoMxAppScheduler
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      TZ: UTC
    command: ["congresomx", "Scheduler"]
    depends_on:
      Mariadb:
        condition: service_healthy
      Redis:
        condition: service_healthy
    networks:
      - CongresoMxNet

volumes:
  MariadbData:
  RedisData:

networks:
  CongresoMxNet:
    driver: bridge
